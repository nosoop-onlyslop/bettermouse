  <rect x="280" y="120" width="168" height="272" rx="24" fill="#E4EDFF"/>

  <!-- Cursor crossing the border between the displays -->
  <path d="M176 150 L176 358 L230.6 308.6 L265.7 384 L298.2 369.7 L263.1 295.6 L332 295.6 Z"
        fill="#0B1220" stroke="#FFFFFF" stroke-width="14"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
