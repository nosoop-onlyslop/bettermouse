name: release

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on semantic version tags (e.g., v1.0.0)

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test BetterMouse.sln -c Release

      - name: Publish (framework-dependent, single file, win-x64)
        run: >
          dotnet publish src/BetterMouse/BetterMouse.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish

      - name: Create draft release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --draft
          --title "Release ${{ github.ref_name }}"
          --generate-notes
          publish/BetterMouse.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
